# Customer Segmentation — central configuration.
# Nothing is hardcoded in the code: every path / parameter lives here.

# Global reproducibility seed (used by KMeans, PCA, and anything stochastic).
seed: 42

paths:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  reports_dir: reports
  figures_dir: reports/figures

dataset:
  # Expected file name of the UCI Online Retail dataset (.xlsx) in data/raw/.
  # If missing, the ETL must STOP and ask for it (never fabricate data).
  raw_filename: "Online Retail.xlsx"
  sheet_name: 0

# Output artifact names (relative to the dirs above).
artifacts:
  transactions_clean: transactions_clean.parquet   # in interim_dir
  rfm: rfm.parquet                                  # in processed_dir
  rfm_clustered: rfm_clustered.parquet              # in processed_dir
  segment_profiles: segment_profiles.csv            # in reports_dir

etl:
  # Invoices starting with this prefix are returns/cancellations -> dropped.
  cancellation_prefix: "C"
  # Rows with non-positive quantity or unit price are dropped.
  min_quantity: 0
  min_unit_price: 0

rfm:
  # snapshot_date for Recency. If null -> max(InvoiceDate) + 1 day.
  snapshot_date: null

model:
  # Range of K to sweep for Elbow + silhouette.
  k_range: [2, 3, 4, 5, 6, 7, 8, 9, 10]
  # Chosen K. If null -> selection stage picks it (best silhouette / elbow).
  chosen_k: null
  random_state: 42
  # Feature preprocessing before KMeans.
  log1p: true        # log1p transform to correct Frequency/Monetary skew
  standardize: true  # StandardScaler after log1p
