[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-segmentation"
version = "0.1.0"
description = "Customer segmentation (RFM + clustering) over transactional retail data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Garai" }]
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.0",
    "openpyxl>=3.1,<3.2",
    "pyarrow>=17,<18",
    "scikit-learn>=1.5,<1.6",
    "matplotlib>=3.9,<3.10",
    "seaborn>=0.13,<0.14",
    "streamlit>=1.37,<1.38",
    "PyYAML>=6.0,<6.1",
    "typer>=0.12,<0.13",
    "click>=8.1,<8.2",  # click>=8.2 breaks typer 0.12 help rendering
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<8.4", "ruff>=0.5,<0.6"]

[project.scripts]
segmentation = "segmentation.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["segmentation"]

[tool.ruff.lint.per-file-ignores]
# The synthetic fixture is a hand-aligned data table; wide rows read better.
"tests/conftest.py" = ["E501"]
# Typer (0.12) resolves runtime annotations and needs `Optional[...]` rather
# than the `X | None` union form for option defaults.
"src/segmentation/cli.py" = ["UP007"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
